[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudshield"
version = "0.1.0"
description = "Privacy-governed collaborative fraud detection"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.34", "pydantic>=2.10", "sqlalchemy>=2.0",
  "cryptography>=44", "numpy>=2.0", "scipy>=1.14", "scikit-learn>=1.6",
  "torch>=2.6", "opacus>=1.5.4", "flwr==1.36.0", "opendp>=0.13",
  "safetensors>=0.5", "httpx>=0.28", "redis>=5", "rq>=2",
  "psycopg[binary]>=3.2", "boto3>=1.36", "stripe>=12"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]
reports = ["matplotlib>=3.10"]

[project.scripts]
fraudshield = "fraudshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
